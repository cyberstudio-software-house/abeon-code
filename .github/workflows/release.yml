name: Release Desktop

on:
  push:
    branches: [main]
    paths:
      - 'DesktopApp/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog: ${{ steps.check.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./DesktopApp/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          last="$(gh release view --json tagName -q .tagName 2>/dev/null || echo '')"
          echo "last release tag: '$last', package version: 'v$version'"
          if [ "$last" = "v$version" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$last" ] && git rev-parse "$last" >/dev/null 2>&1; then
            range="$last..HEAD"
          else
            range=""
          fi
          changelog="$(git log $range --no-merges --pretty=format:'- %s' | grep -v '^- chore(release)' || true)"
          [ -z "$changelog" ] && changelog="- Drobne poprawki i usprawnienia."
          delim="CHANGELOG_EOF_$(openssl rand -hex 16)"
          {
            echo "changelog<<$delim"
            echo "$changelog"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  create-release:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect.outputs.version }}
          NOTES: ${{ needs.detect.outputs.changelog }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f target_commitish="$GITHUB_SHA" -f body="$NOTES" --silent
          else
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="AbeonCode $TAG" -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)"
          fi
          echo "draft release $TAG: $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: [detect, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DesktopApp/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: DesktopApp/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: DesktopApp

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: DesktopApp
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v${{ needs.detect.outputs.version }}
          releaseBody: ${{ needs.detect.outputs.changelog }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')"
          if [ -z "$asset" ]; then
            echo "::error::latest.json is missing from the draft release"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          for platform in linux-x86_64 windows-x86_64 darwin-x86_64 darwin-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url' latest.json > /dev/null; then
              echo "::error::latest.json has no $platform entry, the release stays a draft"
              exit 1
            fi
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
